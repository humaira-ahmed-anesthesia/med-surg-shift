<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Float Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Cozy single-theme world: mint ward walls, cream linens, butter-yellow glow for "do this next". Layout: portrait phone, patient center-left, roster on the right (from the sketch). */
:root{
  --bg:#dff0ea;
  --wall:#eaf6f2;
  --surface:#fffdf7;
  --ink:#2f3d47;
  --muted:#6d7d86;
  --line:#cfe3dc;
  --accent:#2f9c92;
  --glow:#ffcf5c;
  --good:#5bbf88;
  --warn:#f1b04a;
  --bad:#ee7466;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px 12px 14px;user-select:none}

/* header */
.top{display:flex;align-items:center;gap:10px}
.clock{font-family:var(--display);font-weight:600;font-size:20px;background:var(--surface);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.unit{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}
.unit b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:15px}
.score{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.pause{width:38px;height:38px;border-radius:12px;background:var(--surface);box-shadow:0 2px 0 var(--line);display:grid;place-items:center}
.pause svg{width:16px;height:16px}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 56px;gap:8px}
.room{position:relative;min-height:0;background:var(--wall);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.who{display:flex;align-items:baseline;gap:8px}
.who .nm{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rm{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.bar{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:99px;background:var(--good);transition:background-color .3s}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.hp{display:flex;align-items:center;gap:8px}
.hp .bar{flex:1}
.hp span{font-size:12px;font-weight:800;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums}

.order{background:var(--surface);border-radius:16px;padding:10px 10px 10px;box-shadow:0 2px 0 var(--line)}
.order h2{margin:0;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.15;text-wrap:balance}
.order p{margin:2px 0 8px;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.3}
.order.calm h2{color:var(--accent)}
.order.calm p{margin-bottom:0}
.order.urgent{box-shadow:0 0 0 2px var(--bad),0 2px 0 var(--line)}
.order.urgent h2{color:#c9483b}
.steps{display:flex;flex-wrap:wrap;gap:4px 5px}
.chip{display:flex;align-items:center;gap:4px;padding:3px 7px 3px 4px;border-radius:99px;background:#f1f6f4;font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.15}
.chip .ic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip .ic svg{width:16px;height:16px}
.chip.done{opacity:.7;padding-left:8px}
.chip.now{background:#fff3cf;color:var(--ink);box-shadow:0 0 0 2px var(--glow)}

.bedwrap{position:relative;flex:none;height:64px;display:grid;place-items:end center}
.bedwrap svg.pt{height:64px;width:auto;overflow:visible}
.toast{position:absolute;left:50%;top:0;transform:translate(-50%,-6px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:12px;width:max-content;max-width:94%;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.alarm{background:#c9483b}
.toast.good{background:var(--accent)}
.float{position:absolute;left:50%;top:40%;font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);pointer-events:none;animation:up 1s ease-out forwards;z-index:2;text-shadow:0 2px 0 #fff}
.float.minus{color:var(--bad)}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}

/* roster */
.list{display:flex;flex-direction:column;gap:8px;min-height:0}
.pt-card{position:relative;text-align:center;background:var(--surface);border-radius:14px;padding:6px 5px 7px;display:flex;flex-direction:column;align-items:stretch;gap:4px;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.pt-card:active{transform:scale(.97)}
.pt-card.cur{box-shadow:0 0 0 3px var(--accent),0 2px 0 var(--line)}
.pt-card .row{display:flex;flex-direction:column;align-items:center;gap:2px}
.pt-card .av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--wall);overflow:hidden}
.pt-card .av svg{width:100%;height:100%}
.pt-card .rn{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.1}
.pt-card .rn b,.pt-card .state{display:none!important}
.pt-card .rn b{display:block;color:var(--ink);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52px}
.pt-card .bar{height:7px}
.pt-card .need{position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.pt-card .need svg{width:13px;height:13px}
.pt-card .need:empty{display:none}
.pt-card .state{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.1}
.pt-card.alarm{animation:alarm .7s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:0 0 0 3px var(--bad),0 2px 0 var(--line);background:var(--surface)}50%{box-shadow:0 0 0 3px var(--bad),0 2px 0 var(--line);background:#ffe3df}}
.pt-card.cur.alarm{animation:alarmcur .7s ease-in-out infinite}
@keyframes alarmcur{0%,100%{background:var(--surface)}50%{background:#ffe3df}}

/* tray */
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;background:var(--surface);border-radius:20px;padding:9px;box-shadow:0 2px 0 var(--line)}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:14px;background:var(--tint);transition:transform .1s}
.tool:active{transform:scale(.92)}
.tool .ic{width:34px;height:34px;display:grid;place-items:center;color:var(--tc)}
.tool .ic svg{width:28px;height:28px}
.tool span{font-size:11px;font-weight:800;color:var(--ink);line-height:1}
.tool.next{box-shadow:0 0 0 3px var(--glow);animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--glow),0 0 0 0 rgba(255,207,92,.7)}50%{box-shadow:0 0 0 3px var(--glow),0 0 0 9px rgba(255,207,92,0)}}
.tool.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* help */
.help{display:grid;grid-template-columns:1fr 1fr 58px;gap:8px}
.hbtn.snail{flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;text-align:center}
.hbtn.snail b{font-size:12px}
#slow .hi{background:#efe6fb;color:#7c5cc4}
#slow.on{box-shadow:0 0 0 3px #b9a3ea,0 2px 0 var(--line);animation:rrpulse 1.4s infinite}
.app.slowmo .room{box-shadow:inset 0 0 0 3px #b9a3ea}
.app.slowmo .clock{background:#efe6fb}
.hbtn{border-radius:16px;padding:9px 10px;text-align:left;display:flex;align-items:center;gap:9px;background:var(--surface);box-shadow:0 2px 0 var(--line);transition:opacity .2s,transform .1s}
.hbtn:active{transform:scale(.97)}
.hbtn[disabled]{opacity:.5;cursor:default}
.hbtn .hi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.hbtn .hi svg{width:20px;height:20px}
.hbtn b{display:block;font-size:13px;line-height:1.15}
.hbtn small{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
#charge .hi{background:#e3eefb;color:#4f7fc4}
#rr .hi{background:#ffe3df;color:#d4503f}
#rr.ready,#charge.ready{box-shadow:0 0 0 3px var(--bad),0 2px 0 var(--line);animation:rrpulse 1s infinite}
@keyframes rrpulse{50%{background:#fff0ee}}

/* overlay */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(47,61,71,.35);z-index:10}
.overlay[hidden]{display:none}
.card{background:var(--surface);border-radius:26px;padding:22px 20px 20px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(47,61,71,.25)}
.card h1{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:26px;text-wrap:balance}
.card .sub{margin:0 0 14px;color:var(--muted);font-weight:700;font-size:14px}
.card ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.card li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;font-weight:600}
.card li .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--wall);color:var(--accent);font-weight:800;font-size:12px;display:grid;place-items:center}
.go{width:100%;padding:13px;border-radius:16px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 3px 0 #237a72}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #237a72}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
.stars svg{width:46px;height:46px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--wall);border-radius:14px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stat:last-child:nth-child(odd){grid-column:span 2}
.stat span{font-size:11.5px;font-weight:800;color:var(--muted)}
.fine{font-size:11px;color:var(--muted);font-weight:600;margin:10px 0 0;text-align:center;line-height:1.35}
.toggle{display:block;margin:10px auto 0;font-size:12.5px;font-weight:800;color:var(--muted);text-decoration:underline}

/* chart button + results */
.who .chartbtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;padding:4px 9px 4px 7px;border-radius:10px;background:var(--surface);font-size:12px;font-weight:800;color:var(--accent);box-shadow:0 2px 0 var(--line)}
.who .chartbtn svg{width:16px;height:16px}
.results{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;pointer-events:none}
.res{display:flex;align-items:flex-start;gap:8px;max-width:96%;background:var(--surface);border-radius:14px;padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.3;box-shadow:0 4px 14px rgba(47,61,71,.16);animation:resIn .25s ease-out}
.res .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.res .ic svg{width:16px;height:16px}
.res.out{opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s}
@keyframes resIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.flag{color:#c9483b;font-weight:800}
.toast{top:auto;bottom:10px;transform:translate(-50%,6px)}
.toast.show{transform:translate(-50%,0)}
.tool span.lb{max-width:100%;padding:0 2px;text-align:center;overflow-wrap:anywhere}
.tool.next span.lb{color:#8a5a00}
.orbtn{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:14px;background:#4a63c9;color:#fff;font-family:var(--display);font-weight:600;font-size:16px;box-shadow:0 3px 0 #33479a;animation:glow 1s ease-in-out infinite}
.orbtn svg{width:22px;height:22px}
/* vitals monitor */
.vitals{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#22403f;border-radius:14px;padding:5px}
.vc{padding:3px 7px 4px;border-radius:9px;min-width:0}
.vc small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#a7c9c3}
.vc b{display:block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.vc.hr b{color:#8ff0b8}.vc.bp b{color:#ffd0dc}.vc.sp b{color:#8fe3f5}.vc.rr b{color:#fff1a8}.vc.tp b{color:#e3d6ff}
.vc.abn{background:rgba(238,116,102,.3);animation:abn 1.1s ease-in-out infinite}
.vc.abn b{color:#fff}
.vc.abn small{color:#ffd2cc}
@keyframes abn{50%{background:rgba(238,116,102,.55)}}
.vitals.off .vc b{color:#5f7f7c}
.vitbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:9px;background:#e9f6f2;color:var(--ink);font-size:11.5px;font-weight:800;line-height:1.05}
.vitbtn svg{width:15px;height:15px}
.vitbtn small{font-size:9px;font-weight:700;color:var(--muted)}
.vitbtn.next{box-shadow:0 0 0 3px var(--glow);animation:glow 1s ease-in-out infinite;background:#fff3cf}
/* level picker */
.card{max-height:100%;overflow:auto}
.card h3.pick{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:16px}
.levels{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.lvl{display:flex;align-items:center;gap:10px;text-align:left;background:var(--wall);border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 var(--line)}
.lvl:active{transform:scale(.98)}
.lvl .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;display:grid;place-items:center}
.lvl .txt{flex:1;min-width:0}
.lvl b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.2}
.lvl small{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.lvl .st{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;width:54px;gap:1px}
.lvl .st svg{width:17px;height:17px}
.lvl .st small{width:100%;text-align:right;font-size:10.5px}
.chart .at{color:var(--muted);font-weight:600}
.chart .hp-sec{margin:0 0 12px}
.chart .hp-sec h3{margin:0 0 3px;font-family:var(--body);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chart .hp-sec p,.chart .hp-sec li{margin:0;font-size:13px;font-weight:600;line-height:1.4}
.chart .hp-sec ul,.chart .hp-sec ol{margin:0;padding-left:18px;display:block}
.chart .hp-sec li{display:list-item;margin-bottom:3px}
.chart .paused{display:inline-block;margin:0 0 10px;padding:3px 9px;border-radius:99px;background:#fff3cf;font-size:11.5px;font-weight:800;color:#8a5a00}
.unit span{display:block}
.tool.due::after{content:"";position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#f1a33a;box-shadow:0 0 0 2px var(--surface)}
.pt-card.unassessed .av{box-shadow:0 0 0 2px #f1a33a}
/* feed */
.feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:2px 4px 40px;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.fd{display:flex;align-items:center;gap:8px;text-align:left;border-radius:12px;padding:5px 8px;font-size:12.5px;font-weight:700;line-height:1.3;width:100%}
.fd .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.fd .ic svg{width:17px;height:17px}
.fd .tx{flex:1;min-width:0}
.fd small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.fd.task{background:var(--surface);box-shadow:0 2px 0 var(--line)}
.fd.task .tap{flex:none;font-size:11px;font-weight:800;color:var(--accent);background:#e2f3ef;border-radius:99px;padding:3px 8px}
.fd.task.here{box-shadow:0 0 0 2px var(--glow),0 2px 0 var(--line);background:#fffaf0}
.fd.task.urgent{box-shadow:0 0 0 2px var(--bad),0 2px 0 var(--line)}
.fd.task.urgent small{color:#c9483b}
.fd.task.urgent .tap{background:#ffe3df;color:#c9483b}
.fd.task:active{transform:scale(.98)}
.fd.res{background:rgba(255,255,255,.55);font-weight:600;animation:none}
.fd.res.fresh{background:#fff}
.fd.res.new{animation:resIn .3s ease-out}
.feed .lbl{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:4px 2px 0}
button.chip.now{cursor:pointer;animation:glow 1s ease-in-out infinite}
button.chip.now:active{transform:scale(.96)}
.chip .tapit{margin-left:4px;font-size:10px;font-weight:800;color:#8a5a00;background:#ffe39a;border-radius:99px;padding:1px 6px}
.fd.task.info{box-shadow:none;background:rgba(255,255,255,.7)}
.fd.task.info.here{box-shadow:0 0 0 2px var(--glow)}
/* code mode */
.codebar{display:none;grid-column:1 / 3;grid-row:1 / 3;flex-direction:column;justify-content:center;gap:4px;padding:4px 8px}
.vitals.code .vc{display:none}
.vitals.code .codebar{display:flex}
.vitals.code .vitbtn{grid-column:3;grid-row:1 / 3}
.codebar .rh{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;color:#ff9d8f}
.codebar .rh.rosc{color:#8ff0b8}
.codebar .cprt{font-size:12.5px;font-weight:800;color:#a7c9c3;font-variant-numeric:tabular-nums}
.codebar .cprt.on{color:#fff1a8}
.codebar .ff{align-self:stretch;font-size:14px;font-weight:800;color:var(--ink);background:#ffd84d;border-radius:12px;padding:8px 10px;box-shadow:0 0 0 3px #fff1a8;animation:ffpulse 1s ease-in-out infinite}
@keyframes ffpulse{0%,100%{box-shadow:0 0 0 3px #fff1a8,0 0 0 0 rgba(255,216,77,.8)}50%{box-shadow:0 0 0 3px #fff1a8,0 0 0 10px rgba(255,216,77,0)}}
.orbtn.ffbig{background:#ffd84d;color:var(--ink);box-shadow:0 3px 0 #d6a91c;animation:ffpulse 1s ease-in-out infinite}
.codebar .ff[hidden]{display:none}
.tray{grid-template-columns:repeat(var(--n,6),1fr)}
.tray.many{gap:5px;padding:7px}
.tray.many .tool .ic svg{width:23px;height:23px}
.tray.many .tool span.lb{font-size:9.5px;white-space:nowrap;overflow-wrap:normal}
.app.solo .stage{grid-template-columns:1fr}
.app.solo .list{display:none}
.chip.more{opacity:.7}
.coach{background:#24484a;color:#eafaf6;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 3px 0 #173332}
.coach b{color:#fff1a8}
.coach .cstep{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a7c9c3;margin-bottom:2px}
.coach button{margin-top:8px;background:#fff1a8;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:800;font-size:13px}
.howto{margin-top:12px;background:var(--wall);border-radius:14px;padding:10px 12px}
.howto summary{font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.howto ul{margin:10px 0 2px}
.order.calm.lost h2{color:var(--ink)}
.hearts{font-size:18px;color:#e2574c;letter-spacing:1px;white-space:nowrap}
.unit-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 2px 0}
.unit-head b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.hearts-note{font-size:12.5px;font-weight:800;color:#e2574c}
.app.er .list{gap:5px;overflow-y:auto}
.app.er .pt-card{padding:4px 3px 5px;gap:3px}
.app.er .pt-card .av{width:24px;height:24px}
.app.er .pt-card .rn{font-size:10px}
.drips{display:flex;flex-direction:column;gap:4px}
.drip{display:grid;grid-template-columns:1fr auto 40px 40px;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:5px 6px;box-shadow:0 2px 0 var(--line)}
.drip .dn{text-align:left;min-width:0;line-height:1.15}
.drip .dn b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drip .dn small{display:block;font-size:11px;font-weight:800;color:var(--accent)}
.drip .dv{text-align:center;line-height:1.05;min-width:76px}
.drip .dv small{display:block;font-size:9.5px;font-weight:800;color:var(--muted)}
.drip .dv b{display:block;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.drip.ok .dv b{color:#2f9a5e}
.drip.off .dv b{color:#d24a3c}
.drip.off{box-shadow:0 0 0 2px #f0a69c,0 2px 0 var(--line)}
.drip .dm,.drip .dp{height:40px;border-radius:10px;font-size:22px;font-weight:800;background:#eef4f2;color:var(--ink)}
.drip.wantUp .dp,.drip.wantDn .dm{background:#ffe9a8;box-shadow:0 0 0 2.5px var(--glow);animation:dripGlow 1s ease-in-out infinite}
@keyframes dripGlow{50%{box-shadow:0 0 0 5px rgba(255,200,60,.35)}}
.drip.off .gl{color:#d24a3c}
.drip.fixed{grid-template-columns:1fr auto}
.drip.fixed .dv b{font-size:16px;color:var(--ink)}
.drip .dm:active,.drip .dp:active{transform:scale(.92)}
.who .devs{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none;align-self:center}
.who .devs::-webkit-scrollbar{display:none}
.who .dev{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);box-shadow:0 1.5px 0 var(--line);display:grid;place-items:center}
.who .dev:active{transform:scale(.9)}
.hp-sec.dev .devart{float:right;margin:0 0 4px 8px;background:var(--wall);border-radius:12px;padding:4px;line-height:0}
.picks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picks small{font-weight:800;color:var(--muted);font-size:12px}
.orbtn.pick{margin-top:0;background:#e3f1ea;color:#1f6a46;box-shadow:0 2px 0 #b9d8c6;animation:none}
.hp-tabs{display:flex;gap:6px;margin-bottom:10px}
.hp-tabs .tab{flex:1;padding:7px 8px;border-radius:10px;background:var(--wall);font-weight:800;font-size:13px;color:var(--muted)}
.hp-tabs .tab.on{background:var(--accent);color:#fff}
.hp-sec.dev .watch{margin-top:3px;color:var(--ink)}
/* chart */
.chart h1{font-size:22px}
.chart dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.chart dt{font-weight:800;color:var(--muted)}
.chart dd{margin:0;font-weight:700}
.chart dd.allergy{color:#c9483b}
.chart h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px}
.chart .log{max-height:180px;overflow:auto;margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.chart .log li{font-size:12.5px;font-weight:600;line-height:1.35;display:flex;gap:8px}
.chart .log time{flex:none;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .empty{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px}

@media (max-width:360px){
  .stage{grid-template-columns:1fr 54px}
  .tool span{font-size:10px}
  .tool .ic svg{width:24px;height:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
/* ---- compact layout: give the feed the room ---- */
.app{gap:7px;padding:8px 10px 10px}
.top{gap:8px}
.clock{font-size:17px;padding:4px 10px;border-radius:12px}
.unit{font-size:11.5px}
.unit b{font-size:14px}
.score{font-size:16px}
.pause{width:34px;height:34px}
.room{padding:8px;gap:6px;border-radius:18px}
.who{align-items:center;gap:7px}
.whoav{width:30px;height:30px;flex:none;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.whoav svg{width:100%;height:100%}
.who .nm{font-size:16px}
.who .chartbtn{padding:3px 8px 3px 6px;font-size:11.5px}
.bar{height:12px}
.hp{margin-top:2px}
.bedwrap{display:none}
/* vitals: one slim row */
.vitals{margin-top:5px;grid-template-columns:1fr 1.45fr 1fr .85fr 1fr 48px;gap:3px;padding:4px;border-radius:12px}
.vc{padding:2px 4px 3px;border-radius:7px}
.vc small{font-size:8.5px;letter-spacing:.02em}
.vc b{font-size:14px}
.vitbtn{font-size:10px;border-radius:7px;padding:2px 0}
.vitbtn svg{width:13px;height:13px}
.vitbtn small{display:none}
.vitals.code .codebar{grid-column:1 / 6;grid-row:1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:3px 5px}
.vitals.code .vitbtn{grid-column:6;grid-row:1}
.codebar .rh{font-size:16px}
.codebar .cprt{font-size:11px}
.codebar .ff{flex-basis:100%;font-size:13px;padding:6px 8px}
/* order card */
.order{padding:7px 9px;border-radius:13px}
.order h2{font-size:15px}
.order p{font-size:11.5px;margin:1px 0 5px}
.order.calm p{margin-bottom:0}
.orbtn{margin-top:7px;padding:8px;font-size:14px;border-radius:12px}
/* feed */
.feed{gap:5px;padding-bottom:24px}
.coach{padding:8px 10px;font-size:12.5px}
/* tools + help */
.tray{gap:5px;padding:6px;border-radius:16px}
.tool{padding:4px 0 4px;gap:1px;border-radius:11px}
.tool .ic{width:28px;height:28px}
.tool .ic svg{width:24px;height:24px}
.tool span{font-size:10.5px}
.help{gap:6px;grid-template-columns:1fr 1fr 50px}
.hbtn{padding:6px 8px;gap:7px;border-radius:13px}
.hbtn .hi{width:28px;height:28px;border-radius:8px}
.hbtn .hi svg{width:17px;height:17px}
.hbtn b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn > span:last-child{min-width:0}
.hbtn.snail{padding:4px 2px}
.help > *{min-width:0}
.stage{gap:6px}
.pt-card{padding:5px 4px 6px;border-radius:12px}
.pt-card .av{width:28px;height:28px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="clock" id="clock">07:00</div>
    <div class="unit"><b id="unitName">4 West</b><span id="unitSub">Med-Surg day shift</span></div>
    <div class="hearts" id="hearts" hidden></div>
    <div class="score"><span id="score">0</span> <small>pts</small></div>
    <button class="pause" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1.5" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1.5" fill="currentColor"/></svg></button>
  </header>

  <main class="stage">
    <section class="room" aria-live="polite">
      <div>
        <div class="who"><span class="whoav" id="ptAv"></span><span class="nm" id="ptName">Patient</span><span class="devs" id="ptDevs"></span>
          <button class="chartbtn" id="chartBtn" aria-label="Open H&amp;P (pauses the game)"><svg viewBox="0 0 24 24"><path d="M3 6.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#f3d58e" stroke="#c99a3a" stroke-width="1.6" stroke-linejoin="round"/><rect x="6.5" y="9.5" width="11" height="8" rx="1" fill="#fff" stroke="#c99a3a" stroke-width="1.2"/><path d="M8.5 12h7M8.5 14.5h4.5" stroke="#9aa6ad" stroke-width="1.3" stroke-linecap="round"/></svg>H&amp;P</button></div>
        <div class="hp"><div class="bar" id="ptBar"><i></i></div><span id="ptPct">70%</span></div>
        <div class="vitals" id="vitals" aria-label="Vital signs monitor">
          <div class="vc hr" id="vHR"><small>HR</small><b>--</b></div>
          <div class="vc bp" id="vBP"><small>BP</small><b>--</b></div>
          <div class="vc sp" id="vSp"><small>SpO₂</small><b>--</b></div>
          <div class="vc rr" id="vRR"><small>RR</small><b>--</b></div>
          <div class="vc tp" id="vT"><small>Temp</small><b>--</b></div>
          <div class="codebar" id="codebar"><span class="rh" id="rhythm">--</span><span class="cprt" id="cprT">CPR paused</span><button class="ff" id="ffBtn" aria-label="Fast-forward the CPR cycle">⏩ Fast-forward 2 min</button></div>
          <button class="vitbtn" id="vitBtn" aria-label="Take vitals now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span id="vitLbl">Recheck</span><small id="vitAt"></small></button>
        </div>
      </div>
      <div class="drips" id="drips" hidden></div>
      <div class="order" id="order"></div>
      <div class="bedwrap" id="bedwrap">
        <div id="ptArt"></div>
      </div>
      <div class="feed" id="feed" aria-label="Tasks and updates"></div>
      <div class="toast" id="toast"></div>
    </section>
    <aside class="list" id="list" aria-label="Your patients"></aside>
  </main>

  <div class="tray" id="tray" aria-label="Interventions"></div>

  <div class="help">
    <button class="hbtn" id="charge">
      <span class="hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/><path d="M9.5 5.5h5"/></svg></span>
      <span><b>Call charge</b><small id="chargeSub">Helps one step · −20 pts</small></span>
    </button>
    <button class="hbtn" id="rr">
      <span class="hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></span>
      <span><b><span id="rrName">Rapid response</span> <span id="rrCount">×2</span></b><small id="rrSub">Unlocks in the red</small></span>
    </button>
    <button class="hbtn snail" id="slow" aria-label="Slow time for 15 seconds">
      <span class="hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 18.5h14.5a4 4 0 0 0 4-4V10"/><path d="M19.6 10l-1.2-3.2M21.6 10l1-3.3"/><circle cx="10" cy="12" r="5.6"/><path d="M10 12a1.7 1.7 0 1 1 1.7-1.7 3.1 3.1 0 0 1-3.2 3.2"/></svg></span><b id="slowCount">×1</b>
    </button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script>
(function(){
"use strict";

/* ---------- tools ---------- */
const TOOLS = {
  iv:    {name:"IV",     tint:"#e2f0fb", c:"#3f86c8"},
  blood: {name:"Blood",  tint:"#fde3e6", c:"#d0485a"},
  labs:  {name:"Labs",   tint:"#ece6fa", c:"#7c62c4"},
  wound: {name:"Wound",  tint:"#fdebdc", c:"#d27a3c"},
  meds:  {name:"Meds",   tint:"#e0f4e6", c:"#3a9d62"},
  o2:    {name:"O₂",     tint:"#ddf3f6", c:"#2a97a6"},
  assess:{name:"Assess", tint:"#fff0d6", c:"#a8700f"},
  cpr:   {name:"CPR",    tint:"#ffe0ea", c:"#c43c62"},
  shock: {name:"Shock",  tint:"#fff4c2", c:"#a87d00"},
  device:{name:"Device", tint:"#eae4f7", c:"#6a4fb3"},
  md:    {name:"MD",     tint:"#e6ecfb", c:"#3d5fb8"},
  vitals:{name:"Vitals", tint:"#dff3ee", c:"#24484a"},
  esc:   {name:"RRT",    tint:"#ffe3df", c:"#d4503f"},
  go:    {name:"Go",     tint:"#e3e8fb", c:"#4a63c9"}
};
const ORDER = ["assess","iv","labs","meds","wound","o2"];
const btnFor = k => k==="blood" ? "meds" : k;

const ICON = {
  device:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5a4 4 0 0 0 4 4h8a4 4 0 0 1 4 4v3"/><rect x="15.5" y="17" width="9" height="5" rx="1.5" transform="translate(-5 0)"/><circle cx="4" cy="4" r="1.6" fill="currentColor"/></svg>',
  md:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3.5"/><path d="M5 21c.8-4.2 3.6-6.5 7-6.5s6.2 2.3 7 6.5"/><path d="M12 15.5v3M10.5 17h3"/></svg>',
  cpr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7-4.4-7-9.5A3.8 3.8 0 0 1 12 8.5 3.8 3.8 0 0 1 19 11c0 5.1-7 9.5-7 9.5z" fill="currentColor" fill-opacity=".2"/><path d="M7.5 3.5 9 6.5M16.5 3.5 15 6.5M12 2.5V6"/></svg>',
  shock:'<svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L10 22l9-12.5h-6.2z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  assess:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3H4v5a4.5 4.5 0 0 0 9 0V3h-1"/><path d="M8.5 12.5V15a5 5 0 0 0 10 0v-2"/><circle cx="18.5" cy="11" r="2.2" fill="currentColor" fill-opacity=".2"/></svg>',
  vitals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M6 11h3l1.5-3 3 6 1.5-3H18M9 21h6"/></svg>',
  esc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="14" height="5" rx="2"/><path d="M6 14v4M14 14v4M17 11.5h4M19 9.5l2 2-2 2"/><circle cx="6.5" cy="6" r="2"/></svg>',
  iv:'<svg viewBox="0 0 24 24"><path d="M8 2.5h8a2 2 0 0 1 2 2V12a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V4.5a2 2 0 0 1 2-2z" fill="currentColor" opacity=".18"/><path d="M8 2.5h8a2 2 0 0 1 2 2V12a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V4.5a2 2 0 0 1 2-2zM12 16v3.5M12 21.5v.01M9.5 6.5h5M9.5 9.5h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  blood:'<svg viewBox="0 0 24 24"><path d="M8 2.5h8a2 2 0 0 1 2 2V12a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V4.5a2 2 0 0 1 2-2z" fill="currentColor"/><path d="M12 6.2c1.4 1.8 2.2 2.9 2.2 4a2.2 2.2 0 0 1-4.4 0c0-1.1.8-2.2 2.2-4z" fill="#fff"/><path d="M12 16v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  labs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 3h6M15 5h5"/><path d="M6 3v13.5a2 2 0 0 0 4 0V3M16 5v12a1.75 1.75 0 0 0 3.5 0V5"/><path d="M6.6 12h2.8v4.5a1.4 1.4 0 0 1-2.8 0z" fill="currentColor" stroke="none"/><path d="M16.6 13h2.3v4a1.15 1.15 0 0 1-2.3 0z" fill="currentColor" stroke="none" opacity=".6"/></svg>',
  wound:'<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="2.5" y="8.3" width="19" height="7.4" rx="3.7" fill="currentColor" opacity=".25" stroke="currentColor" stroke-width="1.7"/><rect x="8.8" y="8.3" width="6.4" height="7.4" fill="currentColor" opacity=".55"/><circle cx="5.6" cy="12" r=".9" fill="currentColor"/><circle cx="18.4" cy="12" r=".9" fill="currentColor"/></g></svg>',
  meds:'<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><path d="M12 8.3H7.7a3.7 3.7 0 0 0 0 7.4H12z" fill="currentColor"/><rect x="4" y="8.3" width="16" height="7.4" rx="3.7" fill="none" stroke="currentColor" stroke-width="1.7"/></g><circle cx="17.5" cy="18" r="2.6" fill="currentColor" opacity=".35"/></svg>',
  o2:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor" opacity=".16" stroke="currentColor" stroke-width="1.8"/><text x="11" y="15.6" text-anchor="middle" font-size="9.5" font-weight="800" font-family="Nunito,system-ui,sans-serif" fill="currentColor">O</text><text x="16.2" y="17.2" text-anchor="middle" font-size="5.5" font-weight="800" font-family="Nunito,system-ui,sans-serif" fill="currentColor">2</text></svg>'
};

/* Where a patient can be rushed. */
const DEST = {
  or:   {btn:"Rush to surgery",  out:"Off to surgery",      fx:"Surgeon at the bedside. Consent signed, off to the OR.", toast:"is headed to surgery. Great catch."},
  ct:   {btn:"Rush to CT",       out:"Off to CT",           fx:"CT shows no bleeding. The stroke team takes it from here for clot-busting or clot retrieval.", mid:"Back from CT: no bleeding. Clear for a clot-buster if BP is under 185/110.", toast:"is off to CT with the stroke team."},
  nicu: {btn:"Take to the neuro ICU", out:"Off to the neuro ICU", fx:"Settled in the neuro ICU with neuro checks every 15 minutes, watching for bleeding.", toast:"is headed to the neuro ICU."},
  micu: {btn:"Take to the ICU", out:"Off to the ICU", fx:"The ICU team takes over from here.", toast:"is headed up to the ICU."},
  gi:   {btn:"Take for an urgent scope", out:"Off for a scope", fx:"The GI team takes over for an emergency scope to stop the bleeding.", toast:"is off to the GI suite for a scope."},
  ld:   {btn:"Take to Labor & Delivery", out:"Off to Labor & Delivery", fx:"Mom and baby head upstairs together. Congratulations!", toast:"and her new baby are headed to Labor & Delivery."},
  poison:{btn:"Call poison control", out:"", fx:"", mid:"Poison Control notified: the substance, amount and time were reported, and they gave treatment advice.", say:"Poison Control is on the line."},
  icu:  {btn:"Take to the ICU",  out:"Off to the ICU",      fx:"ROSC! The ICU team takes over post-arrest care.", toast:"has a pulse and is headed to the ICU. Great code!"},
  cath: {btn:"Rush to cath lab", out:"Off to the cath lab", fx:"The cath lab team takes over to open the blocked artery.", toast:"is off to the cath lab. Time is muscle."}
};

/* ---------- content ----------
   A step: tool, chip label, short button label, what happened (result popup), alt for a penicillin allergy.
   Vitals steps generate their result from the monitor. esc = call rapid response or charge. go = rush somewhere (b = DEST key).
   v = vitals while the problem is active (they drift back to normal as care is given). r = health drain (%/s). */
const S = (k,l,b,fx,alt) => ({k,l,b,fx,alt});
const VIT = (l) => S("vitals", l || "Check vitals", "", "");

/* admitting problems */
const P = {
  kneepain:{t:"Post-op pain", d:"Day 1 after knee replacement. Pain 8/10.", dx:"Right knee replacement, post-op day 1", surg:true, v:{hr:98,sbp:152,dbp:88},
    s:[S("assess","Pain assessment","Assess","Sharp, throbbing knee pain 8/10. Dressing dry, toes warm and pink."), S("meds","Give IV pain med","Dilaudid","Hydromorphone (Dilaudid) 0.5 mg IV given. Pain down to 4/10.")], r:1.3},
  hgb:{t:"Low hemoglobin", d:"Pale and dizzy after hip surgery.", dx:"Left hip fracture repair, post-op day 2", surg:true, v:{hr:106,sbp:102,dbp:60},
    s:[S("labs","Type & screen","T&S","Hemoglobin 6.8 g/dL (low). Type & screen sent to blood bank."), S("iv","Large-bore IV","18g IV","18-gauge IV placed in the left arm."), S("blood","Hang 1 unit PRBCs","PRBCs","Two-nurse check done. 1 unit PRBCs running with normal saline.")], r:1.5},
  pna:{t:"Pneumonia", d:"Coughing and feverish. SpO₂ 90% on room air.", dx:"Community-acquired pneumonia", v:{spo2:90,t:38.4,hr:104,rr:24},
    s:[S("assess","Listen to lungs","Assess","Coarse crackles over the right lower lung."), S("o2","Start oxygen","NC 2 L","2 L nasal cannula on. SpO₂ up to 94%."), S("labs","Blood cultures","Cultures","2 sets of blood cultures drawn before antibiotics. WBC 16.2 (high)."), S("meds","Start antibiotics","Rocephin","Ceftriaxone (Rocephin) 1 g IV started.")], r:1.6},

/* BP above goal with no drip yet: PRNs first, and check the heart rate before labetalol */
function prnBP(p){
  const hr = p.prnHR, slow = hr < 60;
  return {t:"BP 176/94!", d:"SBP goal is 130–150 and there's no drip yet. Start with a PRN.", r:1.4, v:{sbp:176, dbp:94, hr}, addDrip:"nicard",
    s:[C("vitals","Check the heart rate first","HR", `HR ${hr}${slow?" (low)":""}, BP 176/94 (high).`),
       C("meds","Give a PRN for BP","PRN","", {pick:[
         {b:"Labetalol 10 mg IV", ok:!slow, fx:"Labetalol 10 mg IV. SBP 168, HR 76.",
          bad:`HR is ${hr}. Labetalol is a beta blocker and would slow it even more. Hold it and use the other PRN.`},
         {b:"Hydralazine 10 mg IV", ok:true, fx:"Hydralazine 10 mg IV. SBP 166.",
          note: slow ? "" : "Hydralazine works too. With a normal heart rate, labetalol is usually tried first."}]}),
       C("vitals","Recheck BP in 15 minutes","","SBP still 166 after the PRN (high). The MD orders a nicardipine drip."),
       C("iv","Start the nicardipine drip","Nicardipine","Nicardipine at 2.5 mg/hr. Titrate to SBP 130–150.")]};
}

  const b = p.base, out = {...b};
  if(p.state==="needs" && p.active.def.v){

    const frac = p.active.def.s.some(s=>s.k==="esc") ? done/n*0.35 : done/n*0.85;

      else p.health -= (p.active.def.fatal ? 0 : p.active.def.r) * ramp * dt;

    } else if(p.state === "resting"){
      p.health = Math.min(100, p.health + 3*dt);
      p.timer -= dt;
      if(p.timer <= 0){
        if(p.queue.length){
          p.active = p.queue.shift(); p.state = "needs";
          if(p.active.urgent) alarmFor(p);
          else if(i!==G.current) sfx.ping();
          takeVitals(p);
          dirty = true;
        } else if(p.icu) p.timer = 0.5; else discharge(p);
      }
    } else if(p.state === "leaving"){
      p.timer -= dt;
      if(p.timer <= 0){ p.state = "empty"; p.timer = LV.mode==="er" ? rand(3,7) : 3; dirty = true; }
    } else if(p.state === "empty"){
      p.timer -= dt;
      if(p.timer <= 0){
        if(LV.mode==="icu"){
          if(LV.next && !G.icu.usedNext && (LV.shift||SHIFT) - G.t > 25){
            G.icu.usedNext = true; G.beds[0] = admitICU(LV.next);
            if(LV.nextDrips){ G.icu.drips = LV.nextDrips.map(newDrip); buildDrips(); }
            sfx.ping(); toast(`New admission: ${LV.next.name}, ${LV.next.dx.charAt(0).toLowerCase()+LV.next.dx.slice(1)}.`);
          } else p.timer = 999;
          dirty = true; return;
        }
        if(LV.mode==="er"){
          G.beds[i] = admitER(i); const np = G.beds[i];
          sfx.ping(); toast(`New patient in ${roomLabel(i)}: ${np.active.def.t.replace("!","").toLowerCase()}`, np.active.def.crit ? "alarm" : "");
          if(np.active.def.crit) np.flash = 4;
          dirty = true; return;
        }
        if(LV.mode==="rrt"){
          G.callsDone++;
          if(G.callIdx+1 < LV.calls.length){ G.callIdx++; G.beds[0] = admitCall(G.callIdx); }
          else { endShift(); return; }
        } else G.beds[i] = admit(i,false);
        dirty = true;
      }
    }
  });

  if(LV.mode!=="floor") return;
  G.nextEvent -= dt;
  if(G.nextEvent <= 0){
    G.nextEvent = rand(LV.ev[0],LV.ev[1]) / (1 + 0.5*(G.t/SHIFT));
    const opts = G.beds.filter(p => (p.state==="needs" || p.state==="resting") && !p.doomed && !(p.active && p.active.urgent));
    if(opts.length) suddenDrop(pick(opts));
  }
}
function alarmFor(p){
  p.health = Math.max(12, p.health - (LV.mode==="icu" ? 10 : 25));
  p.flash = 4; sfx.alarm();
  toast(`${roomOf(p)}: ${p.name}, ${p.active.def.t.replace("!","").toLowerCase()}`, "alarm");
  logIt(p, p.active.def.t.replace("!","") + " " + p.active.def.d);
}
function suddenDrop(p){
  const pool = LV.urgent.filter(u => (!u.surg || p.surg) && (!u.blood || p.gotBlood) && (!u.needs || p.got[u.needs]));
  if(!pool.length) return;
  forceUrgent(p, pick(pool));
}
function forceUrgent(p, def){
  if(def.leaves) p.queue = [];
  else if(p.active) p.queue.unshift(p.active);
  p.active = inst(def, p); p.state = "needs";
  p.health = Math.max(12, p.health - 5);
  alarmFor(p); takeVitals(p);
  dirty = true;
}

function choosePick(i){
  const p = cur(); if(!playing() || p.state!=="needs") return;
  const st = curStep(p); if(!st || !st.pick) return;
  const o = st.pick[i];
  if(!o.ok){
    sfx.wrong(); G.score = Math.max(0, G.score - 40); p.health = Math.max(5, p.health - 12);
    G.badPicks = (G.badPicks||0) + 1;
    toast(o.bad, "alarm"); logIt(p, "Held: " + o.b + ". " + o.bad); dirty = true; return;
  }
  sfx.tap(); G.picking = false;
  if(o.note) toast(o.note);
  advance(p, "you", o.fx);
}
function advance(p, by, fxOverride){
  G.picking = false;
  const st = p.active.steps[p.active.step];
  let fx = fxOverride || st.fx;
  if(st.k==="vitals" && !st.fx){ takeVitals(p); fx = vitalsSummary(p.vit); }
  if(st.rh) p.rhythm = st.rh;
  if(st.cpr){ G.cpr = CPR_FOR; }
  if(st.k==="blood" && !/^Stop/.test(st.b)) p.gotBlood = true;
  if(/hydromorphone|oxycodone|morphine/i.test(fx)) p.got.opioid = true;
  if(/antibiotic|cefazolin|ceftriaxone|piperacillin|vancomycin/i.test(fx) && !/stopped/i.test(fx)) p.got.abx = true;
  if(st.k==="assess") p.assessed = true;
  logIt(p, fx + (by==="charge" ? " (charge nurse)" : ""));
  pushFeed(p, st.k, fx);
  p.active.step++;
  p.health = Math.min(100, p.health + 5);
  if(by==="you") G.score += 10;
  if(p.active.step >= p.active.steps.length) complete(p, by);
  dirty = true;
}
/* during a 2-minute CPR cycle, only CPR-time steps (meds, airway, access, labs) can happen */
function cprBlocks(st){
  if(G.cpr>0 && st && !st.during && st.k!=="cpr"){
    sfx.wrong(); toast("Compressions continue. Finish the 2-minute cycle, or tap ⏩ to fast-forward.");
    return true;
  }
  return false;
}
function complete(p, via){
  if(LV.mode==="icu" && G.icu && p.active){
    if(p.active.def.fatal){ passAway(p, p.active.def.fatal); return; }
    const dd = p.active.def;
    if(dd.addDrip && !G.icu.drips.some(x=>x.key===dd.addDrip)){
      G.icu.drips.push(newDrip(dd.addDrip)); buildDrips();
      if(dd.addDrip==="amio") G.icu.sched.push({k:"amioDown", every:0, next:G.t + 90});
    }
    if(dd===CARE.amioDown){ const a = G.icu.drips.find(x=>x.key==="amio"); if(a) a.rate = 0.5; }
    if(Object.values(CARE).includes(p.active.def)) G.icu.caresDone++;
    else if(Object.values(EV).includes(p.active.def)) G.icu.eventsDone++;
  }
  p.health = Math.min(100, p.health + 25);
  const pts = via==="rr" ? 40 : (via==="charge" || via==="team") ? 60 : 100 + Math.round(p.health/4);
  p.teamAuto = false; p.autoT = undefined;
  G.score += pts;
  if(p === cur()) floatText("+"+pts);
  p.active = null; p.state = "resting";
  p.timer = p.queue.length ? (p.queue[0].urgent ? rand(3,5) : rand(5,8)) : 2.5;
  takeVitals(p);
  sfx.done(); dirty = true;
}
function escalate(p, via){
  const fx = via==="charge" ? "Charge nurse called the ICU. Bed assigned, transferring now." : "Rapid response team (ICU nurses) at the bedside. Transferring to the ICU for closer monitoring.";
  G.score += via==="charge" ? 150 : 200; G.escalated++; earnSlow();
  logIt(p, fx);
  pushFeed(p, "esc", fx); if(p === cur()) floatText(via==="charge" ? "+150" : "+200");
  p.state = "leaving"; p.out = "esc"; p.timer = 3.4; p.active = null; p.queue = [];
  sfx.done();
  toast(`${p.name} needs the ICU. You escalated in time.`, "good");
  dirty = true;
}
function rushTo(p){
  const st = curStep(p); if(!st || st.k!=="go") return;
  if(cprBlocks(st)) return;
  const d = DEST[st.b];
  if(p.active.step < p.active.steps.length-1){
    sfx.tap(); toast(d.say || `${p.name} ${d.toast}`, "good");
    advance(p, "you", (st.b==="ct" && p.active.def.ct) || d.mid || d.fx); return;
  }
  logIt(p, d.fx); pushFeed(p, "go", d.fx); if(p === cur()) floatText("+200");
  G.score += 200; G.rushed++; earnSlow(); G.cpr = 0;
  p.state = "leaving"; p.out = "go"; p.dest = st.b; p.timer = 3.4; p.active = null; p.queue = [];
  sfx.done();
  toast(`${p.name} ${d.toast}`, "good");
  dirty = true;
}
function discharge(p){
  G.score += 150; G.discharged++;
  const admitIt = LV.mode==="er" && p.dispo==="admit";
  if(admitIt) G.admitted++;
  p.state = "leaving"; p.out = admitIt ? "admit" : "home"; p.timer = 2.2;
  sfx.home();
  if(p === cur()) floatText("+150");
  if(p.dispoTxt){ logIt(p, p.dispoTxt); pushFeed(p, admitIt ? "md" : "assess", p.dispoTxt); }
  toast(admitIt ? `${p.name} is being admitted upstairs.` : `${p.name} is going home!`, "good");
  if(G.discharged % 3 === 0){ G.rr++; setTimeout(()=>toast(LV.mode==="er" ? "You earned another call for help!" : "You earned a rapid response!", "good"), 1300); }
  else earnSlow();
  dirty = true;
}
function earnSlow(){
  G.saves++;
  if(G.saves % 2 === 0){ G.slows++; setTimeout(()=>toast("You earned a slow moment!", "good"), 1500); }
}
function useSlow(){
  if(!playing() || G.slows<=0 || G.slowLeft>0) return;
  G.slows--; G.slowLeft = SLOW_FOR;
  beep(392,0.25,"sine",0.05); beep(330,0.3,"sine",0.04,0.2);
  toast("Slow motion for 15 seconds. Breathe.", "good");
}
function expire(p){
  p.health = 0; G.expired++; G.cpr = 0;
  if(LV.mode==="er" || LV.mode==="icu") loseHeart();
  if(LV.mode==="icu") setTimeout(()=>{ if(!G.over) endShift(); }, 3500);
  G.score = Math.max(0, G.score - 200);
  const tod = clockStr();
  logIt(p, `Patient expired. Time of death ${tod}.`); pushFeed(p, "esc", `Patient expired. Time of death ${tod}.`);
  p.state = "leaving"; p.out = "expired"; p.timer = 4; p.active = null; p.queue = [];
  if(p === cur()) floatText("−200", true);
  sfx.wrong(); toast(`${p.name} expired. Time of death ${tod}.`, "alarm");
  dirty = true;
}
function transfer(p){
  if(LV.mode==="rrt" || LV.mode==="icu"){ expire(p); return; }
  if(LV.mode==="er"){
    if(p.active && (p.active.def.crit || p.active.def.code)){ expire(p); return; }
    // non-critical patients who wait too long walk out
    p.health = 0; G.lwbs++; G.score = Math.max(0, G.score - 100);
    logIt(p, "Left without being seen."); pushFeed(p, "assess", `${p.name} got tired of waiting and left without being seen.`);
    p.state = "leaving"; p.out = "lwbs"; p.timer = 2.4; p.active = null; p.queue = [];
    if(p === cur()) floatText("−100", true);
    sfx.wrong(); toast(`${p.name} left without being seen.`, "alarm"); dirty = true; return;
  }
  if(LV.mode==="floor" && p.active && p.active.urgent && Math.random() < 0.2){ expire(p); return; } // rare on the floor
  p.health = 0; G.transfers++;
  G.score = Math.max(0, G.score - 150);
  p.state = "leaving"; p.out = "icu"; p.timer = 2.6; p.active = null; p.queue = [];
  if(p === cur()) floatText("−150", true);
  toast(`${p.name} was moved to the ICU for closer care.`, "alarm");
  dirty = true;
}

const playing = () => G.running && !G.paused && !G.over;
function headToToe(p){
  const now = p.active ? p.active.def.t : "";
  const neuro = /altered|unresponsive|sleepy/i.test(now) ? "not at baseline mentally" : "alert and oriented";
  const lungs = /desat|breath|COPD|pneumonia|fluid/i.test(now) || LUNGY.test(p.dx) ? (/heart failure|fluid/i.test(p.dx+now) ? "crackles at the bases" : "coarse breath sounds") : "lungs clear";
  const heart = /racing|afib|chest/i.test(now) ? "heart racing" : "heart regular";
  const pain = /pain/i.test(now) ? "pain 7/10" : p.surg ? "pain 3/10 at the incision" : "pain 1/10";
  const skin = /incision|bleed|wound|dressing|pressure|cellulitis|hives/i.test(now) ? "skin as noted in the current problem" : p.surg ? "skin intact, incision clean" : "skin intact";
  return `Shift assessment done: ${neuro}, ${lungs}, ${heart}, ${pain}, ${skin}.`;
}
function shiftAssess(p){
  p.assessed = true; G.score += 25;
  const fx = headToToe(p);
  logIt(p, fx); pushFeed(p, "assess", fx); if(p === cur()) floatText("+25"); sfx.tap();
  dirty = true;
}
function tapTool(key, btn){
  if(!playing()) return;
  const p = cur();
  if(key==="assess" && !p.assessed && (p.state==="resting" || (p.state==="needs" && curStep(p).k!=="assess"))){ shiftAssess(p); return; }
  if(p.state !== "needs"){
    toast(p.state==="resting" ? `${p.name} is resting. Check your other patients.` : "No patient in this room right now.");
    return;
  }
  const want = curStep(p).k;
  if(key==="shock" && /Asystole|PEA/.test(p.rhythm||"")){
    sfx.wrong(); G.badShocks++; G.score = Math.max(0, G.score - 25);
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
    toast(`${p.rhythm} is not shockable. Never shock it: CPR, epi and find the cause.`, "alarm"); return;
  }
  if(cprBlocks(curStep(p))) return;
  if(want === "md"){ toast("The MD is on it. Watch the feed."); return; }
  if(want === "go"){ sfx.wrong(); toast(`Tap “${DEST[curStep(p).b].btn}” in the order card.`); return; }
  if(want === "esc"){ sfx.wrong(); toast("Time to call for help. Tap Rapid response or Call charge."); return; }
  if(want === "vitals"){ sfx.wrong(); toast("Check vitals first. Tap the Vitals button on the monitor."); return; }
  if(key === btnFor(want) && curStep(p).pick){ sfx.tap(); G.picking = true; dirty = true; return; }
  if(key === btnFor(want)){ sfx.tap(); advance(p, "you"); }
  else{
    sfx.wrong();
    G.score = Math.max(0, G.score - 5);
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
    toast("Not that one. Tap the glowing button.");
  }
}
function tapVitals(){
  if(!playing()) return;
  const p = cur();
  if(p.state==="empty" || p.state==="leaving") return;
  G.tutVitals = true;
  if(curStep(p) && curStep(p).k==="vitals"){ if(cprBlocks(curStep(p))) return; sfx.tap(); advance(p, "you"); return; }
  if(p.active && p.active.def.code){ toast(`Monitor: ${p.rhythm || p.active.def.rh}.`); return; }
  sfx.tap();
  takeVitals(p); dirty = true;
  pushFeed(p, "vitals", vitalsSummary(p.vit));
}
function callCharge(){
  const p = cur();
  if(!playing() || G.chargeCd>0 || p.state!=="needs") return;
  const st = curStep(p);
  if(st.k==="md"){ toast("The MD is on it. Watch the feed."); return; }
  if(cprBlocks(st)) return;
  G.score = Math.max(0, G.score - 20); G.helps++; G.chargeCd = 10;
  if(st.k === "go"){ rushTo(p); return; }
  if(st.k === "esc"){
    if(p.active.step === p.active.steps.length-1){ escalate(p, "charge"); return; }
    floatText("−20", true); advance(p, "charge", (st.fx || "Charge nurse called for help.")); return;
  }
  floatText("−20", true);
  advance(p, "charge");
}
function callRR(){
  const p = cur();
  if(!playing() || p.state!=="needs") return;
  const st = curStep(p);
  if(st.k === "go") return;
  if(st.k === "esc"){
    if(cprBlocks(st)) return;
    G.rrUsed++;
    if(p.active.step === p.active.steps.length-1 && LV.mode!=="icu") escalate(p, "rr");
    else advance(p, "you", st.fx || (LV.mode==="rrt" ? "More help is on the way." : LV.mode==="er" ? "Help is here." : "Rapid response team at the bedside."));
    return;
  }
  if(LV.mode==="er" || LV.mode==="icu"){
    if(!(G.rr>0 && p.health<30) || st.k==="md") return;
    G.rr--; G.rrUsed++; p.teamAuto = true; p.autoT = 0.3; p.health = Math.max(p.health, 50);
    pushFeed(p, "esc", "Help is here: the MD, RT, a second nurse and a tech are all working at once.");
    toast("The whole team is in the room.", "good"); dirty = true; return;
  }
  if(LV.mode==="rrt" || !(G.rr>0 && p.health<30)) return;
  G.rr--; G.rrUsed++;
  p.health = Math.max(p.health, 50);
  logIt(p, "Rapid response team at the bedside: " + p.active.steps.slice(p.active.step).map(s=>s.k==="vitals"?"Vitals rechecked.":s.fx).join(" "));
  toast(`Rapid response team took over ${p.name}'s care.`, "good");
  complete(p, "rr");
}

/* Task cards: every patient's next step, tappable. Current patient first, then emergencies. */
function feedTasks(){
  const out = [];
  G.beds.forEach((b,i)=>{
    const st = curStep(b);
    if(st && i!==G.current){
      const label = st.k==="go" ? DEST[st.b].btn : st.k==="esc" ? st.l.replace(/^Escalate: /,"") : st.l;
      out.push({i, k:st.k, label, urgent:b.active.urgent, here:i===G.current, prob:b.active.def.t.replace("!",""), kind:"step"});
    }
    if(LV.mode!=="rrt" && (b.state==="needs"||b.state==="resting") && !b.assessed && !(st && st.k==="assess"))
      out.push({i, k:"assess", label:"Shift assessment", urgent:false, here:i===G.current, prob:"Due this shift", kind:"shift"});
  });
  if(LV.mode==="icu" && G.icu){
    G.icu.sched.filter(sc=>sc.next!==Infinity).sort((a,b)=>a.next-b.next).forEach(sc=>{
      const mins = Math.max(0, Math.round((sc.next - G.t) * 4));
      out.push({i:0, k:CARE[sc.k].s[0].k, label:CARE[sc.k].t, urgent:false, here:false, prob:`due in ${mins} min`, kind:"due"});
    });
  }
  const rank = t => (t.here && t.kind==="step" ? 0 : t.urgent ? 1 : t.here ? 2 : t.kind==="step" ? 3 : 4);
  return out.sort((a,b)=>rank(a)-rank(b));
}
function renderFeed(){

  const upd = f => { const n = !f.seen; f.seen = true; return `<div class="fd res ${n?"new":""} ${now-f.ts<6000?"fresh":""}">`; };
  const updB = f => `${upd(f)}${ic(f.k)}<span class="tx"><small>${f.at} · ${f.room} · ${esc(f.who)}</small>${flagify(f.fx)}</span></div>`;
  const latest = G.feed[0] && now - G.feed[0].ts < 6000 ? G.feed[0] : null;
  const rest = latest ? G.feed.slice(1) : G.feed;
  const fe = $("#feed"), top = G.feed[0] ? G.feed[0].ts : 0;

    (latest ? updB(latest) : "") +

      return `<div class="fd task info ${t.urgent||crit?"urgent":""} ${t.here?"here":""}">${inner}</div>`;
    }).join("")

function doTask(i, kind){

}

    ov.hidden = false;
    ov.innerHTML = `<div class="card"><h1>Out of hearts</h1><p class="sub">The ER needs you rested. Your next heart comes back in <b id="hTimer">${mmss(nextHeartIn())}</b>.</p>
      <p class="fine">Hearts come back one every 30 minutes, up to 3. Med-Surg, Rapid Response and the tutorials don't use hearts.</p>
      <button class="go" id="listBtn">Back to the shift list</button></div>`;
    $("#listBtn").addEventListener("click", showStart);
    const iv = setInterval(()=>{ const el = document.getElementById("hTimer"); if(!el){ clearInterval(iv); return; } if(heartsNow()>0){ clearInterval(iv); showStart(); return; } el.textContent = mmss(nextHeartIn()); }, 1000);
    return;
  }
  LV = target;
  newGame(); clearResults(); start();
}
function showPause(){
  ov.hidden = false;
  ov.innerHTML = `<div class="card"><h1>Paused</h1><p class="sub">Your patients will wait.</p>
    <button class="go" id="resumeBtn">Back to the floor</button>
    <button class="toggle" id="soundBtn">${soundOn?"Turn sound off":"Turn sound on"}</button>
    <button class="toggle" id="quitBtn">Quit to shift list</button></div>`;
  $("#resumeBtn").addEventListener("click", ()=>{ G.paused = false; ov.hidden = true; });
  $("#soundBtn").addEventListener("click", e=>{ soundOn = !soundOn; e.target.textContent = soundOn?"Turn sound off":"Turn sound on"; });
  $("#quitBtn").addEventListener("click", ()=>{ G.running = false; showStart(); });
}
function showChart(){
  const p = cur();
  if(p.state==="empty") return;
  const wasRunning = playing();
  if(G.running) G.paused = true;
  G.tutChart = true;
  const now = p.state==="needs" ? `${p.active.def.t.replace("!","")}: ${p.active.def.d}` : null;
  const v = p.vit;
  ov.hidden = false;
  const meds = p.pmh.map(x=>HOME_MEDS[x]).filter(Boolean);
  const lungs = LUNGY.test(p.dx) ? (/heart failure/i.test(p.dx) ? "Crackles at both bases. Swelling in both legs." : "Coarse breath sounds and wheezes.") : "Lungs clear. Heart regular.";
  const gen = p.health>=70 ? "Resting comfortably, no distress." : p.health>=40 ? "Uncomfortable but alert." : "Ill-appearing and anxious.";
  const plan = [p.active, ...p.queue].filter(Boolean);
  const devTab = p.devices ? `<div class="hp-tabs"><button class="tab on" data-tab="hp">H&amp;P</button><button class="tab" data-tab="dev">Lines &amp; drains</button></div>` : "";
  const devHtml = p.devices ? `<div class="tabpane" data-pane="dev" hidden>
      ${p.devices.map(k=>[k,DEV[k]]).map(([k,d])=>`<div class="hp-sec dev"><span class="devart">${devSVG(k,44)}</span><h3>${esc(d.n)}</h3><p>${esc(d.w)}</p><p class="watch"><b>Watch for:</b> ${esc(d.k)}</p></div>`).join("")}
      ${G.icu ? G.icu.drips.map(d=>`<div class="hp-sec dev"><h3>Drip: ${esc(d.def.name)}</h3><p>${esc(d.def.why)}</p></div>`).join("") : ""}
    </div>` : "";
  ov.innerHTML = `<div class="card chart" role="dialog" aria-label="History and physical for ${esc(p.name)}">
    ${wasRunning?`<span class="paused">Game paused</span>`:""}
    ${devTab}
    <div class="tabpane" data-pane="hp">
    <h1>${esc(p.name)}</h1><p class="sub">${roomOf(p)} · ${p.age} years · ${p.kg} kg · ${esc(p.code)}</p>
    <div class="hp-sec"><h3>History of present illness</h3><p>${p.age}-year-old ${p.age<18 ? (p.sex==="man"?"boy":"girl") : p.sex} ${p.pmh[0]==="None" ? "with no medical history" : "with a history of " + esc(listJoin(p.pmh.map(x=>/^[A-Z]{2,}/.test(x)?x:x.charAt(0).toLowerCase()+x.slice(1))))}, ${LV.mode==="er" ? "here today with" : "admitted for"} ${LV.mode==="er" ? esc(p.active ? p.active.def.t.replace("!","").toLowerCase() : p.dx.toLowerCase()) : esc(p.dx.charAt(0).toLowerCase()+p.dx.slice(1))}. ${esc(p.hpi)}</p></div>
    <div class="hp-sec"><h3>Past medical history</h3><p>${p.pmh.map(esc).join(", ")}</p></div>
    <div class="hp-sec"><h3>Home medications</h3><p>${meds.length ? meds.map(esc).join(". ")+"." : "None"}</p></div>
    <div class="hp-sec"><h3>Allergies</h3><p class="${p.allergy.startsWith("No ")?"":"flag"}">${esc(p.allergy)}</p></div>
    <div class="hp-sec"><h3>Social history</h3><p>${esc(p.social)}</p></div>
    <div class="hp-sec"><h3>Exam</h3><p>${gen} ${lungs}${p.surg?" Surgical incision dressed.":""}</p>${v?`<p>${flagify(vitalsSummary(v))} <span class="at">(${v.at})</span></p>`:""}</div>
    <div class="hp-sec"><h3>Assessment &amp; plan</h3>${plan.length ? `<ol>${plan.map(a=>`<li><b>${esc(a.def.t.replace("!",""))}:</b> ${a.steps.map(s=>esc(s.l)).join(" → ")}</li>`).join("")}</ol>` : `<p>Stable. Plan for discharge.</p>`}</div>
    <h3>This shift</h3>
    ${p.log.length ? `<ul class="log">${p.log.slice().reverse().map(([t,x])=>`<li><time>${t}</time><span>${flagify(x)}</span></li>`).join("")}</ul>` : `<p class="empty">Nothing charted yet.</p>`}
    </div>
    ${devHtml}
    <button class="go" id="closeChart">${wasRunning?(LV.mode==="icu"?"Back to the bedside":"Back to the floor"):"Close chart"}</button>
  </div>`;
  ov.querySelectorAll(".hp-tabs .tab").forEach(t=>t.addEventListener("click", ()=>{
    ov.querySelectorAll(".hp-tabs .tab").forEach(x=>x.classList.toggle("on", x===t));
    ov.querySelectorAll(".tabpane").forEach(pn=>pn.hidden = pn.dataset.pane !== t.dataset.tab);
    if(t.dataset.tab==="dev") G.tutDevices = true;
  }));
  $("#closeChart").addEventListener("click", ()=>{
    if(wasRunning){ G.paused = false; ov.hidden = true; checkCoach(); }
    else if(G.over){ endShift(true); }
    else if(!G.running){ showStart(); }
    else { showPause(); }
  });
}
let lastReport = null;
function endShift(reshow){
  if(!reshow){
    G.over = true; G.running = false;
    const due = G.all.filter(p => p.admittedAt < SHIFT-20);
    G.assessedN = due.filter(p=>p.assessed).length; G.dueN = due.length;
    const rrt = LV.mode==="rrt", erm = LV.mode==="er", icum = LV.mode==="icu";
    if(icum) G.inPct = G.icu.total ? Math.round(100 * G.icu.inRange / (G.icu.total)) : 0;
    G.seen = G.discharged + G.rushed;
    const s1 = G.outOfHearts ? false : icum ? (G.expired===0 && G.icu.caresDone >= 3) : rrt ? G.callsDone >= LV.calls.length : erm ? G.seen >= 5 : G.discharged >= 3;
    const s2 = s1 && G.score >= LV.stars[0];
    const s3 = s2 && G.score >= LV.stars[1] && G.transfers === 0 && G.expired===0 && (rrt ? G.badShocks===0 : icum ? G.inPct >= 70 : erm ? true : G.assessedN === G.dueN);
    const stars = s3 ? 3 : s2 ? 2 : s1 ? 1 : 0;
    const prev = saved[LV.n] || {stars:0, best:0};
    const isBest = G.score > (prev.best||0);
    saved[LV.n] = {stars:Math.max(prev.stars||0, stars), best:Math.max(prev.best||0, G.score)}; save();
    lastReport = {stars, isBest};
  }
  const {stars, isBest} = lastReport;
  const msg = stars===3 ? "Flawless shift. Your patients adore you." : stars===2 ? "Solid shift. Everyone's in good hands." : stars===1 ? "You made it through. Go eat something." : "Tough shift. They happen to everyone.";
  const msg2 = (LV.mode==="icu" && G.icu && G.icu.passed && !G.outOfHearts) ? (stars>=2 ? "You lost a patient tonight, and you still gave everyone excellent care. Take a breath." : "A hard shift, and a patient you couldn't save. That one wasn't on you.") : msg;
  ov.hidden = false;
  const idx = LEVELS.indexOf(LV), nextL = LEVELS[idx+1];
  const statsHtml = LV.mode==="icu" ? `
      <div class="stat"><b>${G.score}</b><span>Points${isBest?" · new best":""}</span></div>
      <div class="stat"><b>${G.inPct}%</b><span>Time with drips in range</span></div>
      <div class="stat"><b>${G.icu.caresDone}</b><span>Hourly cares done</span></div>
      <div class="stat"><b>${G.icu.eventsDone}</b><span>Alarms &amp; events handled</span></div>
      ${G.icu.passed ? `<div class="stat"><b>${G.icu.passed}</b><span>Died despite everything (not counted against you)</span></div>` : ""}
      <div class="stat"><b>${G.expired}</b><span>Patients lost</span></div>
      ${LV.tutorial ? "" : `<div class="stat"><b>${heartRow(heartsNow())}</b><span>Hearts left</span></div>`}` : LV.mode==="er" ? `
      <div class="stat"><b>${G.score}</b><span>Points${isBest?" · new best":""}</span></div>
      <div class="stat"><b>${G.seen}</b><span>Patients seen</span></div>
      <div class="stat"><b>${G.discharged - G.admitted}</b><span>Discharged home</span></div>
      <div class="stat"><b>${G.admitted}</b><span>Admitted upstairs</span></div>
      <div class="stat"><b>${G.rushed}</b><span>Rushed to OR, CT, cath lab, L&amp;D or ICU</span></div>
      <div class="stat"><b>${G.lwbs}</b><span>Left without being seen</span></div>
      <div class="stat"><b>${G.expired}</b><span>Patients expired</span></div>
      <div class="stat"><b>${heartRow(heartsNow())}</b><span>Hearts left</span></div>` : LV.mode==="rrt" ? `
      <div class="stat"><b>${G.score}</b><span>Points${isBest?" · new best":""}</span></div>
      <div class="stat"><b>${G.callsDone}/${LV.calls.length}</b><span>Calls answered</span></div>
      <div class="stat"><b>${G.rushed}</b><span>Got to the ICU, OR or CT</span></div>
      <div class="stat"><b>${G.expired}</b><span>Patients expired</span></div>
      <div class="stat"><b>${G.badShocks}</b><span>Shocks on a non-shockable rhythm</span></div>
      <div class="stat"><b>${G.ff}</b><span>CPR cycles fast-forwarded</span></div>` : "";
  const head = G.outOfHearts ? "Out of hearts" : LV.mode==="rrt" ? "Rapid response report" : "Shift report";
  const sub = G.outOfHearts ? `You lost all 3 hearts. The next one comes back in ${mmss(nextHeartIn())}.` : `${esc(LV.name)}. ${msg2}`;
  ov.innerHTML = `<div class="card"><h1>${head}</h1><p class="sub">${sub}</p>
    <div class="stars">${starsRow(stars)}</div>
    <div class="stats">${statsHtml || `
      <div class="stat"><b>${G.score}</b><span>Points${isBest?" · new best":""}</span></div>
      <div class="stat"><b>${G.discharged}</b><span>Sent home</span></div>
      <div class="stat"><b>${G.escalated}</b><span>Escalated to ICU in time</span></div>
      <div class="stat"><b>${G.rushed}</b><span>Rushed to OR, CT or cath lab</span></div>
      <div class="stat"><b>${G.transfers}</b><span>Moved to ICU too late</span></div>
      <div class="stat"><b>${G.helps}</b><span>Times you called charge</span></div>
      <div class="stat"><b>${G.assessedN}/${G.dueN}</b><span>Patients assessed</span></div>
      ${G.expired ? `<div class="stat"><b>${G.expired}</b><span>Patients expired</span></div>` : ""}`}
    </div>
    ${nextL ? `<button class="go" id="nextBtn">Next: ${esc(nextL.name)}</button>` : ""}
    <button class="${nextL ? "toggle" : "go"}" id="againBtn">Play this level again</button>
    <button class="toggle" id="listBtn">All shifts</button>
    <p class="fine">${LV.mode==="icu" ? `★ do 3 cares with nobody lost · ★★ ${LV.stars[0].toLocaleString()} pts · ★★★ ${LV.stars[1].toLocaleString()} pts with drips in range 70% of the shift` : LV.mode==="er" ? `★ see 5 patients · ★★ ${LV.stars[0].toLocaleString()} pts · ★★★ ${LV.stars[1].toLocaleString()} pts and nobody lost` : LV.mode==="rrt" ? `★ answer every call · ★★ ${LV.stars[0].toLocaleString()} pts · ★★★ ${LV.stars[1].toLocaleString()} pts, nobody expired and no wrong shocks` : `★ 3 patients home · ★★ ${LV.stars[0].toLocaleString()} pts · ★★★ ${LV.stars[1].toLocaleString()} pts, nobody lost or moved to ICU too late, and every patient assessed`}</p></div>`;
  const nb = $("#nextBtn"); if(nb) nb.addEventListener("click", ()=>startLevel(nextL.n));
  $("#againBtn").addEventListener("click", ()=>startLevel(LV.n));
  $("#listBtn").addEventListener("click", showStart);
}
function start(){
  try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){ ac = null; }
  G.running = true; G.paused = false; G.over = false; ov.hidden = true; dirty = true;
  clearTimeout(toastT); $("#toast").className = "toast";
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && playing()){ G.paused = true; showPause(); } });

/* ---------- loop ---------- */
let last = 0;
function frame(ts){
  const dt = last ? Math.min(0.1, (ts-last)/1000) : 0; last = ts;
  if(playing()){
    let gdt = dt;
    if(G.slowLeft>0){ G.slowLeft = Math.max(0, G.slowLeft - dt); gdt = dt*SLOW_RATE; }
    update(gdt);
    checkCoach();
  }
  if(dirty){ renderAll(); dirty = false; }
  updateLive();
  if(G.feed && G.feed[0] && !G.feed[0].aged && performance.now()-G.feed[0].ts > 6000){ G.feed[0].aged = true; dirty = true; }
  requestAnimationFrame(frame);
}
LV = LEVELS[1]; newGame(); showStart(); renderAll(); updateLive();
requestAnimationFrame(frame);
})();
</script>
